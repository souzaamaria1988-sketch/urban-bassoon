name: Build and Release Fabric Mod

on:
  push:
    branches: [ "main" ]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: gradle build

      - name: Get timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ steps.timestamp.outputs.ts }}
          name: Development Build ${{ steps.timestamp.outputs.ts }}
          files: build/libs/*.jar
          draft: false
          prerelease: true
          generate_release_notes: false
