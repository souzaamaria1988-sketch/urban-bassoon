name: Build Fabric Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      # Esta action já instala e configura o Gradle automaticamente
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      # O comando agora usa 'gradle' diretamente, não './gradlew'
      - name: Build with Gradle
        run: gradle build
        
      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: examplemod-fabric-1.21.1
          path: build/libs/*.jar
          retention-days: 7
